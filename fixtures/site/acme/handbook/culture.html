      <h1>Our Engineering Culture</h1>
      <p>
        We optimise for written communication, small reviewable changes, and strong test
        coverage. Engineers are expected to own features end to end and to mentor others as
        they grow. We prefer boring, well-understood technology over novelty.
      </p>
